<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Configuração Smart Home</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-zinc-950 text-white min-h-screen pb-16">

<div class="max-w-5xl mx-auto p-6">

    <!-- HEADER COM INFORMAÇÕES DO USUÁRIO E LOGOUT -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8">
        <div>
            <h1 class="text-4xl font-bold">
                ⚙️ Configuração da Casa
            </h1>
            <p id="userGreeting" class="text-zinc-400 text-sm mt-1">Gerencie os parâmetros da residência e da IA</p>
        </div>

        <div class="flex items-center gap-3">
            <div id="userBadge" class="bg-zinc-900 border border-zinc-800 px-4 py-2.5 rounded-2xl text-xs flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-green-400"></span>
                <span id="userNameDisplay" class="font-bold text-zinc-200">Usuário</span>
            </div>
            <button onclick="handleLogout()" class="bg-red-950/80 hover:bg-red-900 border border-red-800/60 text-red-200 px-4 py-2.5 rounded-2xl text-xs font-bold transition flex items-center gap-1.5">
                <span>🚪</span>
                <span>Sair</span>
            </button>
        </div>
    </div>

    <div class="bg-zinc-900 rounded-3xl p-6">

        <h2 class="text-xl font-bold mb-4 text-zinc-300">
            📡 Conexão MQTT
        </h2>

        <div class="grid md:grid-cols-2 gap-4">

            <div>
                <label class="block mb-2 text-sm text-zinc-400">
                    Broker MQTT
                </label>

                <input
                    id="broker"
                    class="w-full bg-zinc-800 p-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="test.mosquitto.org"
                >
            </div>

            <div>
                <label class="block mb-2 text-sm text-zinc-400">
                    Porta WebSocket
                </label>

                <input
                    id="port"
                    type="number"
                    class="w-full bg-zinc-800 p-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="8080"
                >
            </div>

        </div>

        <h2 class="text-xl font-bold mt-8 mb-4 text-zinc-300">
            🎙️ Assistente de Voz & Inteligência Artificial
        </h2>

        <div class="grid md:grid-cols-3 gap-4">

            <div>
                <label class="block mb-2 text-sm text-zinc-400">
                    Nome do Agente (Palavra de Ativação)
                </label>

                <input
                    id="agentName"
                    class="w-full bg-zinc-800 p-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    placeholder="Sexta-Feira"
                >
                <p class="text-xs text-zinc-500 mt-1">
                    Ex: <i>Sexta-Feira</i>, <i>Meu Agente</i>, <i>Jarvis</i>.
                </p>
            </div>

            <div>
                <label class="block mb-2 text-sm text-zinc-400">
                    Modelo de Inteligência Artificial
                </label>

                <input
                    id="aiModel"
                    list="aiModelSuggestions"
                    class="w-full bg-zinc-800 p-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 font-mono text-sm"
                    placeholder="gemini-2.5-flash-lite"
                >
                <datalist id="aiModelSuggestions">
                    <option value="gemini-2.5-flash-lite">
                    <option value="gemini-2.5-flash">
                    <option value="gemini-2.0-flash">
                    <option value="gemini-1.5-flash">
                    <option value="gpt-4o-mini">
                    <option value="gpt-4o">
                </datalist>

                <div class="flex flex-wrap gap-1.5 mt-2">
                    <button type="button" onclick="document.getElementById('aiModel').value='gemini-2.5-flash-lite'" class="text-[11px] bg-zinc-800 hover:bg-zinc-700 text-indigo-300 px-2.5 py-1 rounded-lg border border-zinc-700 transition">gemini-2.5-flash-lite</button>
                    <button type="button" onclick="document.getElementById('aiModel').value='gemini-2.5-flash'" class="text-[11px] bg-zinc-800 hover:bg-zinc-700 text-indigo-300 px-2.5 py-1 rounded-lg border border-zinc-700 transition">gemini-2.5-flash</button>
                    <button type="button" onclick="document.getElementById('aiModel').value='gpt-4o-mini'" class="text-[11px] bg-zinc-800 hover:bg-zinc-700 text-indigo-300 px-2.5 py-1 rounded-lg border border-zinc-700 transition">gpt-4o-mini</button>
                </div>
            </div>

            <div>
                <label class="block mb-2 text-sm text-zinc-400">
                    Chave de API (Gemini ou OpenAI)
                </label>

                <input
                    id="geminiApiKey"
                    type="password"
                    class="w-full bg-zinc-800 p-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 font-mono text-sm"
                    placeholder="AIzaSy... ou sk-..."
                >
                <p class="text-xs text-zinc-500 mt-1">
                    Chave do Google AI Studio ou OpenAI.
                </p>
            </div>

        </div>

    </div>

    <div class="bg-zinc-900 rounded-3xl p-6 mt-8">

        <div class="flex justify-between items-center mb-5">

            <h2 class="text-2xl font-bold">
                Cômodos
            </h2>

            <button
                onclick="addRoom()"
                class="bg-green-600 px-5 py-3 rounded-xl font-semibold hover:bg-green-500 transition"
            >
                + Adicionar Cômodo
            </button>

        </div>

        <div id="rooms" class="space-y-3"></div>

    </div>

    <button
        onclick="saveConfig()"
        class="mt-8 w-full bg-blue-600 hover:bg-blue-500 transition py-4 rounded-2xl font-bold text-lg shadow-lg shadow-blue-600/30"
    >
        Salvar Configuração
    </button>

    <a
        href="/"
        class="block text-center mt-4 text-blue-400 hover:text-blue-300 font-semibold"
    >
        Abrir Painel Principal →
    </a>

</div>

<script>

// =========================================================================
// GUARDIÃO DE AUTENTICAÇÃO JWT
// =========================================================================
const token = localStorage.getItem("smartHomeToken");
if (!token) {
    alert("Acesso restrito. Faça login para continuar.");
    location.href = "/login.html";
}

const userObjStr = localStorage.getItem("smartHomeUser");
if (userObjStr) {
    try {
        const user = JSON.parse(userObjStr);
        document.getElementById("userNameDisplay").innerText = user.name || user.email;
        document.getElementById("userGreeting").innerText = `Logado como ${user.email}`;
    } catch(e) {}
}

function handleLogout() {
    if (confirm("Deseja realmente sair do sistema?")) {
        localStorage.removeItem("smartHomeToken");
        localStorage.removeItem("smartHomeUser");
        location.href = "/login.html";
    }
}

let rooms = [];

function slugify(text) {
    return text
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/\s+/g, "")
        .replace(/[^a-z0-9]/g, "");
}

function addRoom() {
    const roomName = prompt("Nome do cômodo (ex: Sala, Quarto, Cozinha):");
    if(!roomName || !roomName.trim()) return;

    rooms.push({
        id: Date.now(),
        name: roomName.trim(),
        topic: slugify(roomName)
    });

    renderRooms();
}

function removeRoom(id) {
    rooms = rooms.filter(room => room.id !== id);
    renderRooms();
}

function renderRooms() {
    document.getElementById("rooms").innerHTML = rooms.length ? rooms.map(room => `
        <div class="bg-zinc-800 p-4 rounded-xl flex justify-between items-center">
            <div>
                <div class="font-bold">${room.name}</div>
                <div class="text-sm text-zinc-400 font-mono">Tópico MQTT: pensador/casa/${room.topic}/set</div>
            </div>
            <button onclick="removeRoom(${room.id})" class="bg-red-600 hover:bg-red-500 px-4 py-2 rounded-lg font-medium transition">
                Remover
            </button>
        </div>
    `).join("") : `<div class="text-zinc-500 italic p-4 text-center">Nenhum cômodo adicionado ainda.</div>`;
}

function saveConfig() {
    const agentNameInput = document.getElementById("agentName").value.trim();
    const aiModelInput = document.getElementById("aiModel").value.trim();

    const config = {
        broker: document.getElementById("broker").value.trim() || "test.mosquitto.org",
        port: document.getElementById("port").value.trim() || "8080",
        agentName: agentNameInput || "Sexta-Feira",
        aiModel: aiModelInput || "gemini-2.5-flash-lite",
        geminiApiKey: document.getElementById("geminiApiKey").value.trim(),
        rooms
    };

    localStorage.setItem("smartHomeConfig", JSON.stringify(config));
    if (config.geminiApiKey) {
        localStorage.setItem("geminiApiKey", config.geminiApiKey);
    }
    if (config.agentName) {
        localStorage.setItem("smartHomeAgentName", config.agentName);
    }

    alert("Configurações salvas com sucesso!");
}

function loadConfig() {
    const saved = localStorage.getItem("smartHomeConfig");
    if(!saved) return;

    const config = JSON.parse(saved);
    document.getElementById("broker").value = config.broker || "test.mosquitto.org";
    document.getElementById("port").value = config.port || "8080";
    document.getElementById("agentName").value = config.agentName || "Sexta-Feira";
    document.getElementById("aiModel").value = config.aiModel || "gemini-2.5-flash-lite";
    document.getElementById("geminiApiKey").value = config.geminiApiKey || localStorage.getItem("geminiApiKey") || "";
    rooms = config.rooms || [];
    renderRooms();
}

loadConfig();

</script>

</body>
</html>
