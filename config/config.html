<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Configuração MQTT</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-zinc-950 text-white min-h-screen">

<div class="max-w-5xl mx-auto p-6">

    <h1 class="text-4xl font-bold mb-8">
        ⚙️ Configuração da Casa
    </h1>

    <div class="bg-zinc-900 rounded-3xl p-6">

        <div class="grid md:grid-cols-2 gap-4">

            <div>
                <label class="block mb-2">
                    Broker MQTT
                </label>

                <input
                    id="broker"
                    class="w-full bg-zinc-800 p-3 rounded-xl"
                    placeholder="test.mosquitto.org"
                >
            </div>

            <div>
                <label class="block mb-2">
                    Porta WebSocket
                </label>

                <input
                    id="port"
                    type="number"
                    class="w-full bg-zinc-800 p-3 rounded-xl"
                    placeholder="8080"
                >
            </div>

        </div>

    </div>

    <div class="bg-zinc-900 rounded-3xl p-6 mt-8">

        <div class="flex justify-between items-center mb-5">

            <h2 class="text-2xl font-bold">
                Cômodos
            </h2>

            <button
                onclick="addRoom()"
                class="bg-green-600 px-5 py-3 rounded-xl"
            >
                + Adicionar
            </button>

        </div>

        <div id="rooms" class="space-y-3"></div>

    </div>

    <button
        onclick="saveConfig()"
        class="mt-8 w-full bg-blue-600 py-4 rounded-2xl font-bold text-lg"
    >
        Salvar Configuração
    </button>

    <a
        href="../index.html"
        class="block text-center mt-4 text-blue-400"
    >
        Abrir Painel →
    </a>

</div>

<script>

let rooms = [];

function slugify(text) {

    return text
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/\s+/g, "")
        .replace(/[^a-z0-9]/g, "");
}

function addRoom() {

    const roomName =
        prompt("Nome do cômodo");

    if(!roomName) return;

    rooms.push({
        id: Date.now(),
        name: roomName,
        topic: slugify(roomName)
    });

    renderRooms();
}

function removeRoom(id) {

    rooms =
        rooms.filter(
            room => room.id !== id
        );

    renderRooms();
}

function renderRooms() {

    document
        .getElementById("rooms")
        .innerHTML = rooms.map(room => `

        <div
            class="bg-zinc-800 p-4 rounded-xl flex justify-between items-center">

            <div>

                <div class="font-bold">
                    ${room.name}
                </div>

                <div class="text-sm text-zinc-400">
                    ${room.topic}
                </div>

            </div>

            <button
                onclick="removeRoom(${room.id})"
                class="bg-red-600 px-4 py-2 rounded-lg"
            >
                Remover
            </button>

        </div>

    `).join("");
}

function saveConfig() {

    const config = {

        broker:
            document
            .getElementById("broker")
            .value,

        port:
            document
            .getElementById("port")
            .value,

        rooms

    };

    localStorage.setItem(
        "smartHomeConfig",
        JSON.stringify(config)
    );

    alert("Configuração salva.");
}

function loadConfig() {

    const saved =
        localStorage.getItem(
            "smartHomeConfig"
        );

    if(!saved) return;

    const config =
        JSON.parse(saved);

    document
        .getElementById("broker")
        .value =
        config.broker || "";

    document
        .getElementById("port")
        .value =
        config.port || "8080";

    rooms =
        config.rooms || [];

    renderRooms();
}

loadConfig();

</script>

</body>
</html>
