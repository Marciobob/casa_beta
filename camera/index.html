<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ESP32-CAM Dashboard Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0b1220;
  --panel:#111a2e;
  --card:#0f1b33;
  --stroke:rgba(255,255,255,.08);
  --text:#e5e7eb;
  --muted:#94a3b8;
  --blue:#3b82f6;
  --green:#22c55e;
  --red:#ef4444;
  --orange:#f97316;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter;
  background: radial-gradient(circle at top, #0b1220, #05070d);
  color:var(--text);
}

/* layout */
.container{
  max-width:1200px;
  margin:0 auto;
  padding:24px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px 22px;
  background:rgba(255,255,255,.03);
  border:1px solid var(--stroke);
  border-radius:16px;
  margin-bottom:20px;
}

.title{
  font-size:18px;
  font-weight:700;
}

.subtitle{
  font-size:12px;
  color:var(--muted);
}

/* grid */
.grid{
  display:grid;
  grid-template-columns: 2fr 1fr;
  gap:18px;
}

/* camera */
.camera{
  position:relative;
  background:rgba(255,255,255,.03);
  border:1px solid var(--stroke);
  border-radius:16px;
  overflow:hidden;
}

.camera img{
  width:100%;
  height:520px;
  object-fit:contain;
  background:#000;
}

/* cards */
.cards{
  display:grid;
  grid-template-columns:1fr;
  gap:12px;
}

.card{
  background:rgba(255,255,255,.03);
  border:1px solid var(--stroke);
  border-radius:14px;
  padding:14px;
}

.label{
  font-size:11px;
  color:var(--muted);
  letter-spacing:.12em;
  text-transform:uppercase;
}

.value{
  font-size:18px;
  font-weight:600;
  margin-top:6px;
}

/* status */
.status{
  padding:6px 12px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
}

.online{background:rgba(34,197,94,.15); color:var(--green);}
.offline{background:rgba(239,68,68,.15); color:var(--red);}

/* button */
.btn{
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  font-weight:700;
  cursor:pointer;
  transition:.2s;
}

.btn-blue{background:var(--blue); color:white;}
.btn-blue:hover{opacity:.9}

.btn-orange{background:var(--orange); color:white;}
.btn-orange:hover{opacity:.9}

.btn:active{transform:scale(.98)}

.footer-grid{
  margin-top:18px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.small-card{
  background:rgba(255,255,255,.03);
  border:1px solid var(--stroke);
  border-radius:14px;
  padding:14px;
}
</style>
</head>

<body>

<div class="container">

  <!-- HEADER -->
  <div class="header">
    <div>
      <div class="title">📷 ESP32-CAM Control Center</div>
      <div class="subtitle">Dashboard profissional de monitoramento IoT</div>
    </div>

    <div id="status" class="status offline">OFFLINE</div>
  </div>

  <!-- MAIN -->
  <div class="grid">

    <!-- CAMERA -->
    <div class="camera">
      <img id="img" src="" />
    </div>

    <!-- SIDEBAR -->
    <div class="cards">

      <div class="card">
        <div class="label">IP</div>
        <div class="value" id="ip">--</div>
      </div>

      <div class="card">
        <div class="label">WiFi RSSI</div>
        <div class="value" id="rssi">--</div>
      </div>

      <div class="card">
        <div class="label">Uptime</div>
        <div class="value" id="uptime">--</div>
      </div>

      <button id="flashBtn" class="btn btn-blue" onclick="toggleFlash()">
        FLASH OFF
      </button>

    </div>
  </div>

  <!-- BOTTOM CARDS -->
  <div class="footer-grid">

    <div class="small-card">
      <div class="label">HEAP</div>
      <div class="value" id="heap">--</div>
    </div>

    <div class="small-card">
      <div class="label">PSRAM</div>
      <div class="value" id="psram">--</div>
    </div>

    <div class="small-card">
      <div class="label">CPU</div>
      <div class="value" id="cpu">--</div>
    </div>

    <div class="small-card">
      <div class="label">CAM</div>
      <div class="value">LIVE</div>
    </div>

  </div>

</div>

<script>
const IP = "192.168.1.7";

let flash = false;

const img = document.getElementById("img");
const status = document.getElementById("status");
const btn = document.getElementById("flashBtn");

function setStatus(ok){
  status.className = "status " + (ok ? "online" : "offline");
  status.innerText = ok ? "ONLINE" : "OFFLINE";
}

function updateBtn(){
  btn.className = flash ? "btn btn-orange" : "btn btn-blue";
  btn.innerText = flash ? "FLASH ON" : "FLASH OFF";
}

async function loadStatus(){
  try{
    const r = await fetch(`http://${IP}/status`);
    const d = await r.json();

    document.getElementById("ip").innerText = d.ip;
    document.getElementById("rssi").innerText = d.rssi + " dBm";

    let t = d.uptime;
    document.getElementById("uptime").innerText =
      `${Math.floor(t/3600)}h ${Math.floor((t%3600)/60)}m`;

    document.getElementById("heap").innerText = (d.heap/1024).toFixed(1)+" KB";
    document.getElementById("psram").innerText = (d.psram/1024).toFixed(1)+" KB";
    document.getElementById("cpu").innerText = d.cpu+" MHz";

    flash = d.flash === 1;

    setStatus(true);
    updateBtn();

  }catch(e){
    setStatus(false);
  }
}

async function loadImg(){
  const tmp = new Image();
  tmp.src = `http://${IP}/snapshot?t=${Date.now()}`;
  tmp.onload = () => img.src = tmp.src;
}

async function toggleFlash(){
  try{
    await fetch(`http://${IP}/flash?state=${flash?0:1}`);
    flash = !flash;
    updateBtn();
  }catch(e){}
}

setInterval(loadStatus, 9000);
setInterval(loadImg, 4000);

loadStatus();
loadImg();
updateBtn();
</script>

</body>
</html>
