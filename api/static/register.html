<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro • Smart Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass {
            background: rgba(24, 24, 27, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
    </style>
</head>

<body class="bg-gradient-to-br from-zinc-950 via-zinc-900 to-black text-white min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full glass border border-zinc-800 rounded-3xl p-8 shadow-2xl relative overflow-hidden my-8">
        
        <!-- Efeito decorativo de fundo -->
        <div class="absolute -top-24 -right-24 w-48 h-48 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-purple-600/20 rounded-full blur-3xl pointer-events-none"></div>

        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-indigo-600/20 border border-indigo-500/30 text-3xl mb-4">
                👤
            </div>
            <h1 class="text-3xl font-black tracking-tight">Criar Conta</h1>
            <p class="text-zinc-400 text-sm mt-1">Cadastre seus dados para acessar o sistema</p>
        </div>

        <div id="alertBox" class="hidden mb-6 p-4 rounded-2xl text-xs font-semibold flex items-center gap-2"></div>

        <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-zinc-400 uppercase tracking-wider mb-2">Nome Completo</label>
                <input id="name" type="text" required placeholder="Ex: Márcio Silva"
                    class="w-full bg-zinc-900/90 border border-zinc-800 focus:border-indigo-500 rounded-2xl px-4 py-3 text-sm focus:outline-none transition">
            </div>

            <div>
                <label class="block text-xs font-bold text-zinc-400 uppercase tracking-wider mb-2">Telefone</label>
                <input id="phone" type="tel" placeholder="(11) 98765-4321"
                    class="w-full bg-zinc-900/90 border border-zinc-800 focus:border-indigo-500 rounded-2xl px-4 py-3 text-sm focus:outline-none transition">
            </div>

            <div>
                <label class="block text-xs font-bold text-zinc-400 uppercase tracking-wider mb-2">E-mail</label>
                <input id="email" type="email" required placeholder="seuemail@exemplo.com"
                    class="w-full bg-zinc-900/90 border border-zinc-800 focus:border-indigo-500 rounded-2xl px-4 py-3 text-sm focus:outline-none transition">
            </div>

            <div>
                <label class="block text-xs font-bold text-zinc-400 uppercase tracking-wider mb-2">Senha de Acesso</label>
                <input id="password" type="password" required minlength="4" placeholder="Mínimo 4 caracteres"
                    class="w-full bg-zinc-900/90 border border-zinc-800 focus:border-indigo-500 rounded-2xl px-4 py-3 text-sm focus:outline-none transition">
            </div>

            <button id="submitBtn" type="submit"
                class="w-full bg-gradient-to-r from-indigo-600 to-indigo-500 hover:from-indigo-500 hover:to-indigo-400 text-white font-bold py-4 rounded-2xl shadow-lg shadow-indigo-600/30 transition duration-300 transform active:scale-95 flex items-center justify-center gap-2 mt-6">
                <span>Concluir Cadastro</span>
                <span>✓</span>
            </button>
        </form>

        <div class="mt-6 pt-6 border-t border-zinc-800/80 text-center text-xs text-zinc-400">
            Já possui uma conta?
            <a href="/login.html" class="text-indigo-400 hover:text-indigo-300 font-bold ml-1 transition underline">Faça login aqui</a>
        </div>

    </div>

    <script>
        function showAlert(msg, isSuccess = false) {
            const box = document.getElementById("alertBox");
            box.className = isSuccess
                ? "mb-6 p-4 rounded-2xl text-xs font-semibold flex items-center gap-2 bg-green-500/10 border border-green-500/30 text-green-300"
                : "mb-6 p-4 rounded-2xl text-xs font-semibold flex items-center gap-2 bg-red-500/10 border border-red-500/30 text-red-300";
            box.innerHTML = `<span>${isSuccess ? '✅' : '⚠️'}</span><span>${msg}</span>`;
            box.classList.remove("hidden");
        }

        async function handleRegister(e) {
            e.preventDefault();
            const btn = document.getElementById("submitBtn");
            const name = document.getElementById("name").value.trim();
            const phone = document.getElementById("phone").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            btn.disabled = true;
            btn.innerHTML = `<span class="inline-block animate-spin mr-2">🔄</span> Cadastrando...`;

            try {
                const res = await fetch("/api/auth/register", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name, phone, email, password })
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.detail || "Falha ao criar cadastro.");
                }

                showAlert("Conta criada com sucesso! Redirecionando...", true);
                
                // Salvar JWT Token e dados do usuário
                localStorage.setItem("smartHomeToken", data.access_token);
                localStorage.setItem("smartHomeUser", JSON.stringify(data.user));

                setTimeout(() => {
                    location.href = "/";
                }, 1000);

            } catch (err) {
                showAlert(err.message, false);
                btn.disabled = false;
                btn.innerHTML = `<span>Concluir Cadastro</span><span>✓</span>`;
            }
        }
    </script>

</body>

</html>
